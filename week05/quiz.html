<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML/CSS Knowledge Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Source+Code+Pro&display=swap');
    </style>
</head>
<body>
    <header>
        <h1>Web Wizard Quiz
            by Bro. Evance
        </h1>
        <p>Test your HTML & CSS knowledge!</p>
    </header>

    <main>
        <form id="quiz-form" action="#" method="post">
            <div class="quiz-card">
                <h2>Question 1: Acronyms</h2>
                <label for="q1">What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1" placeholder="Your answer..." required>
            </div>

            <div class="quiz-card">
                <h2>Question 2: Selectors</h2>
                <label for="q2">Explain how id and class attributes are selected in CSS:</label>
                <textarea id="q2" name="q2" rows="4" placeholder="Type your explanation here..."></textarea>
            </div>

            <div class="quiz-card">
                <h2>Question 3: Comments</h2>
                <label for="q3">Which of the following is a valid CSS comment?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One...</option>
                    <option value="option1">/* This is a comment */</option>
                    <option value="option2">// This is a comment</option>
                    <option value="option3"><!-- This is a comment --></option>
                    <option value="option4">' This is a comment</option>
                </select>
            </div>

            <div class="quiz-card">
                <h2>Question 4: Box Model</h2>
                <label for="q4">What is the bottom margin given this declaration: margin: 10px 5px 15px 20px;</label>
                <input type="number" id="q4" name="q4" min="0" max="50" placeholder="Enter a number">
            </div>

            <div class="quiz-card submit-section">
                <button type="submit" class="submit-btn">Submit Quiz</button>
            </div>
        </form>
    </main>

    <footer>
        <p>© 2023 Web Fundamentals Quiz | WDD I30</p>
    </footer>
</body>
</html>
