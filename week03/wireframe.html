<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting</title>
    <link rel="stylesheet" href="styles/stylees.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
      <div class="logo">
        <img src="images/logo.png" alt="White Water Rafting Logo">
      </div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About Us</a></li>
                <li><a href="#trips">Trips</a></li>
                <li><a href="#contact">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <h1>White Water Rafting</h1>
        <button class="cta-button">Call to Action</button>
    </section>

    <section id="trips" class="trip-section">
        <div class="trip-card">Image 1</div>
        <div class="trip-card">Image 2</div>
        <div class="trip-card">Image 3</div>
    </section>

    <section class="info-section">
        <div class="info-image">Large Image</div>
        <div class="info-box">
            <h2>Heading</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
            <button class="contact-btn">Contact Us</button>
        </div>
    </section>

    <section class="history">
        <h2>History</h2>
    </section>

    <section class="adventure">
        <h2>Adventure Awaits You</h2>
    </section>

    <footer>
        <p>Footer Content including Social Media Icons/Links</p>
    </footer>
